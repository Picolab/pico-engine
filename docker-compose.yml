# Local pico-engine 1.5.2 from this checkout (Dockerfile.local).
#
# Build:  docker compose build
# Run:    docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
#
# Data persists in ./docker/pico-image (PICO_ENGINE_HOME).
# The engine writes internal-token there. A dev MCP on the host needs
# PICO_ENGINE_HOME pointed at that directory (the container path is /var/pico-image).
#
# Cross-engine demo: two host processes (see docs/guides/layer2-subscriptions.md).

services:
  pico-engine:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: picolabs/pico-engine:1.5.2
    ports:
      - "3001:3000"
    volumes:
      - ./docker/pico-image:/var/pico-image
    environment:
      PICO_ENGINE_BASE_URL: http://localhost:3001
    restart: unless-stopped
